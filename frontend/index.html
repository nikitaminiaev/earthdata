<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Earthdata — Геологическая карта</title>
<link rel="stylesheet" href="/static/leaflet/leaflet.css"/>
<script src="/static/leaflet/leaflet.js"></script>
<style>
  body, html { margin:0; padding:0; height:100%; font-family:sans-serif; }
  #map { height:100vh; width:100vw; }
  #info-panel {
    position:absolute; top:10px; right:10px; z-index:1000;
    background:rgba(255,255,255,0.95); padding:12px 16px;
    border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.3);
    max-width:360px; max-height:80vh; overflow-y:auto;
    font-size:13px; display:none;
  }
  #info-panel h3 { margin:0 0 8px; font-size:15px; }
  #info-panel .row { display:flex; justify-content:space-between; padding:2px 0; }
  #info-panel .label { color:#666; }
  #info-panel .value { font-weight:600; text-align:right; }
  #info-panel .deposit { padding:4px 0; border-bottom:1px solid #eee; font-size:12px; }
  #search-box {
    position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:1000;
    background:white; padding:6px 12px; border-radius:6px;
    box-shadow:0 2px 6px rgba(0,0,0,0.3); display:flex; gap:8px;
  }
  #search-box input { border:1px solid #ccc; border-radius:4px; padding:6px 10px; width:260px; font-size:13px; }
  #search-box button { background:#4a7; color:white; border:none; border-radius:4px; padding:6px 14px; cursor:pointer; font-size:13px; }
  #search-results {
    position:absolute; top:55px; left:50%; transform:translateX(-50%); z-index:1000;
    background:white; border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,0.3);
    max-height:300px; overflow-y:auto; width:420px; display:none;
  }
  #search-results .item { padding:8px 12px; border-bottom:1px solid #eee; cursor:pointer; font-size:13px; }
  #search-results .item:hover { background:#e8f5e9; }
  .controls {
    position:absolute; bottom:30px; left:10px; z-index:1000;
    background:rgba(255,255,255,0.92); padding:10px 14px; border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.25); font-size:13px; min-width:190px;
  }
  .controls label { display:flex; align-items:center; gap:8px; padding:3px 0; cursor:pointer; }
  .controls input[type=checkbox] { width:16px; height:16px; cursor:pointer; accent-color:#4a7; }
  .controls .swatch { display:inline-block; width:12px; height:12px; border-radius:50%; flex-shrink:0; }
  #viewer-overlay {
    display:none; position:fixed; z-index:10000; left:0; top:0; width:100%; height:100%;
    background:rgba(0,0,0,0.85); justify-content:center; align-items:center;
  }
  #viewer-container {
    background:#fff; border-radius:8px; max-width:95vw; max-height:95vh;
    overflow:hidden; display:flex; flex-direction:column; box-shadow:0 4px 20px rgba(0,0,0,0.5);
  }
  #viewer-header {
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 12px; border-bottom:1px solid #ddd; font-size:14px; font-weight:600;
  }
  #viewer-close { background:none; border:none; font-size:20px; cursor:pointer; color:#666; padding:0 4px; }
  #viewer-close:hover { color:#000; }
  #viewer-body { padding:8px; display:flex; justify-content:center; align-items:center; overflow:auto; flex:1; }
  #viewer-footer {
    display:flex; justify-content:center; align-items:center; gap:12px;
    padding:8px; border-top:1px solid #ddd; font-size:13px;
  }
  #viewer-footer button {
    background:#eee; border:1px solid #ccc; border-radius:4px; padding:4px 12px; cursor:pointer; font-size:16px;
  }
  #viewer-footer button:hover { background:#ddd; }
  #viewer-footer button:disabled { opacity:0.3; cursor:default; }
</style>
</head>
<body>
<div id="map"></div>

<div id="search-box">
  <input id="search-input" placeholder="Search mineral (gold, coal, uranium, copper, iron...)" onkeydown="if(event.key==='Enter') searchMineral()"/>
  <button onclick="searchMineral()">Search</button>
</div>
<div id="search-results"></div>

<div id="viewer-overlay" onclick="closeGeoknigaViewer()">
  <div id="viewer-container" onclick="event.stopPropagation()">
    <div id="viewer-header">
      <span id="viewer-title"></span>
      <button id="viewer-close" onclick="closeGeoknigaViewer()">✕</button>
    </div>
    <div id="viewer-body">
      <img id="viewer-img" style="max-width:100%;max-height:calc(100vh - 100px);display:none"/>
      <object id="viewer-pdf" style="width:100%;height:calc(100vh - 100px);display:none"></object>
      <div id="viewer-error" style="display:none;color:#c44;padding:20px"></div>
    </div>
    <div id="viewer-footer">
      <button onclick="prevGeoknigaFile()" id="viewer-prev">◀</button>
      <span id="viewer-counter"></span>
      <button onclick="nextGeoknigaFile()" id="viewer-next">▶</button>
    </div>
  </div>
</div>

<div id="info-panel">
  <h3>Point info</h3>
  <div class="row"><span class="label">Coordinates</span><span class="value" id="coord-val">—</span></div>
  <div class="row"><span class="label">Elevation</span><span class="value" id="elev-val">—</span></div>
    <div class="row"><span class="label">Rock type</span><span class="value" id="geol-val">—</span></div>
  <div class="row"><span class="label">Age/Era</span><span class="value" id="rock-val">—</span></div>
  <div class="row"><span class="label">Groundwater</span><span class="value" id="gw-val" style="font-weight:400;font-size:11px">—</span></div>
  <hr style="margin:6px 0"/>
  <div style="font-weight:600;margin-bottom:4px">Nearby deposits:</div>
  <div id="deposits-list"></div>
</div>

<div class="controls">
  <div style="font-weight:600;margin-bottom:4px;font-size:12px;color:#555">LAYERS</div>
  <label><input type="checkbox" checked onchange="elevLayer.setVisible(this.checked)"><span class="swatch" style="background:#b87"></span>Relief (ASTER/GEBCO)</label>
  <label><input type="checkbox" checked onchange="mrdsLayer.setVisible(this.checked)"><span class="swatch" style="background:#c44"></span>Deposits (MRDS)</label>
  <label><input type="checkbox" id="chk-osm-mining" onchange="osmMiningLayer.setVisible(this.checked);toggleMiningLegend(this.checked)"><span class="swatch" style="background:#e80"></span>Quarries (OSM)</label>
  <div id="mining-legend" style="display:none;margin-top:4px;font-size:11px;padding:4px 6px;background:#f8f8f8;border-radius:4px;max-height:150px;overflow-y:auto">
    <div style="font-weight:600;margin-bottom:2px">Resources:</div>
  </div>
  <label><input type="checkbox" id="chk-rosnedra" onchange="rosnedraLayer.setVisible(this.checked);toggleRosnedraLegend(this.checked)"><span class="swatch" style="background:#e67e22"></span>Rosnedra 2026</label>
  <div id="rosnedra-legend" style="display:none;margin-top:4px;font-size:11px;padding:4px 6px;background:#f8f8f8;border-radius:4px;max-height:150px;overflow-y:auto">
    <div style="font-weight:600;margin-bottom:2px">Resource types:</div>
  </div>
  <label><input type="checkbox" id="chk-geokniga" onchange="geoknigaLayer.setVisible(this.checked);toggleGeoknigaLegend(this.checked)"><span class="swatch" style="background:#9b59b6"></span>GeoKniga catalog</label>
  <div id="geokniga-legend" style="display:none;margin-top:4px;font-size:11px;padding:4px 6px;background:#f8f8f8;border-radius:4px;max-height:150px;overflow-y:auto">
    <div style="font-weight:600;margin-bottom:2px">Scale:</div>
  </div>
  <label><input type="checkbox" id="chk-geol" disabled onchange="geolLayer.setVisible(this.checked)"><span class="swatch" style="background:#888"></span>Geology (USGS)</label>
  <label><input type="checkbox" id="chk-gw" disabled onchange="gwLayer.setVisible(this.checked)"><span class="swatch" style="background:#66a"></span>Groundwater (IGRAC)</label>
  <hr style="margin:4px 0"/>
  <div style="font-weight:600;font-size:12px;color:#555;margin-bottom:2px">BASEMAP</div>
  <label><input type="radio" name="basemap" id="rb-online" onchange="setBasemap('online')"><span style="color:#888">🌐 Online</span></label>
  <label><input type="radio" name="basemap" onchange="setBasemap('offline')" id="rb-offline"><span style="color:#888" id="offline-label">📡 Offline (not ready)</span></label>
</div>

<script>
console.log('=== Earthdata starting ===');
console.log('Leaflet L defined:', typeof L !== 'undefined');

// Global error handler
window.onerror = function(msg, url, line) {
  console.error('GLOBAL ERROR:', msg, url, line);
  document.body.insertAdjacentHTML('afterbegin', '<div style="background:red;color:white;padding:10px;font-size:14px;position:fixed;top:0;left:0;right:0;z-index:9999">JS ERROR: ' + msg + ' (line ' + line + ')</div>');
};

// Catch promise rejections
window.addEventListener('unhandledrejection', function(e) {
  console.error('UNHANDLED PROMISE:', e.reason);
});

const map = L.map('map', {
  center: [55.75, 37.62],
  zoom: 4,
  maxZoom: 14,
  minZoom: 2,
});

console.log('Map created');

// Direct tile test (bypass Leaflet)
const testImg = new Image();
testImg.onload = () => console.log('Direct tile test: OK');
testImg.onerror = () => console.error('Direct tile test: FAILED');
testImg.src = '/api/osm-tiles/10/619/320.png';

// base layers
const osmOnline = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });
const osmOffline = L.tileLayer('/api/osm-tiles/{z}/{x}/{y}.png', { maxZoom: 14, minZoom: 2 });

// Start with offline basemap
osmOffline.addTo(map);
console.log('osmOffline.addTo called');
document.getElementById('rb-offline').checked = true;
document.getElementById('rb-offline').disabled = false;
document.getElementById('offline-label').textContent = '📡 Offline (ready)';
console.log('Offline basemap active');

function setBasemap(mode) {
  console.log('setBasemap:', mode);
  if (mode === 'online') {
    if (map.hasLayer(osmOffline)) map.removeLayer(osmOffline);
    if (!map.hasLayer(osmOnline)) map.addLayer(osmOnline);
  } else {
    if (map.hasLayer(osmOnline)) map.removeLayer(osmOnline);
    if (!map.hasLayer(osmOffline)) map.addLayer(osmOffline);
  }
  console.log('Layers on map:', Object.keys(map._layers).length);
}

map.on('tileerror', function(e) {
  console.error('Tile error:', e.tile.src, e.error || 'unknown');
});

map.on('tileload', function(e) {
  console.log('Tile loaded:', e.tile.src);
});

// layers
const elevLayer = L.tileLayer('/api/tiles/{z}/{x}/{y}.png?layer=elevation', {
  maxZoom: 14, opacity: 0.55,
}).addTo(map);

const mrdsLayer = L.geoJSON(null, {
  pointToLayer: (f, latlng) => L.circleMarker(latlng, {
    radius: 4, fillColor: '#c44', color: '#c44', weight: 1, opacity: 0.6, fillOpacity: 0.5,
  }),
  onEachFeature: (f, layer) => {
    const p = f.properties || {};
    layer.bindPopup(`${p.name || '?'}<br>${p.c1 || ''} ${p.c2 || ''}<br>${p.ct || ''}`);
  },
}).addTo(map);

const RESOURCE_COLORS = {
  'gold': '#ffd700', 'silver': '#c0c0c0', 'platinum': '#e5e4e2',
  'copper': '#b87333', 'iron': '#8b4513',
  'coal': '#333', 'peat': '#8b6914',
  'sand': '#f5deb3', 'gravel': '#d2b48c',
  'limestone': '#d3d3d3', 'clay': '#cd853f',
  'aggregate': '#a9a9a9', 'stone': '#a0a0a0', 'dimension_stone': '#b0a0c0',
  'manganese': '#778899', 'chromium': '#708090',
  'tin': '#dcdcdc', 'tungsten': '#696969',
};
const RESOURCE_DEFAULT = '#e80';

function resourceColor(resource) {
  if (!resource) return RESOURCE_DEFAULT;
  return RESOURCE_COLORS[resource.toLowerCase()] || RESOURCE_DEFAULT;
}

const osmMiningLayer = L.geoJSON(null, {
  pointToLayer: (f, latlng) => {
    const color = resourceColor(f.properties?.resource);
    return L.circleMarker(latlng, {
      radius: 5, fillColor: color, color: color, weight: 1, opacity: 0.6, fillOpacity: 0.5,
    });
  },
  onEachFeature: (f, layer) => {
    const p = f.properties || {};
    const res = p.resource || 'quarry';
    const info = [p.name, res].filter(Boolean).join('<br>');
    layer.bindPopup(info || 'Quarry');
  },
});

const ROSNEDRA_COLORS = {
  'углеводородное сырье': '#e67e22',
  'промышленные подземные воды': '#3498db',
  'минеральные воды': '#2ecc71',
  'другое': '#95a5a6',
};

const rosnedraLayer = L.geoJSON(null, {
  pointToLayer: (f, latlng) => {
    const color = ROSNEDRA_COLORS[f.properties?.mineral_cat] || '#95a5a6';
    return L.circleMarker(latlng, {
      radius: 6, fillColor: color, color: '#333', weight: 1, opacity: 0.7, fillOpacity: 0.6,
    });
  },
  onEachFeature: (f, layer) => {
    const p = f.properties || {};
    const parts = [p.name].filter(Boolean);
    if (p.region) parts.push(`<i>${p.region}</i>`);
    if (p.mineral) parts.push(`<b>${p.mineral}</b>`);
    if (p.usage) parts.push(p.usage);
    if (p.area) parts.push(`Площадь: ${p.area}`);
    if (p.form) parts.push(`Форма: ${p.form}`);
    if (p.timing) parts.push(`Сроки: ${p.timing}`);
    layer.bindPopup(parts.join('<br>'));
  },
});

const GEOKNIGA_SCALE_COLORS = {
  '1:25K': '#e74c3c', '1:50K': '#e67e22', '1:100K': '#f1c40f',
  '1:200K': '#2ecc71', '1:500K': '#3498db', '1:1M': '#9b59b6',
};

function geoknigaScaleLabel(scale) {
  if (!scale) return { color: '#999', label: 'unknown' };
  const d = parseInt(scale.replace(/[^0-9]/g,''), 10);
  if (d <= 25000) return { color: '#e74c3c', label: '1:25K' };
  if (d <= 50000) return { color: '#e67e22', label: '1:50K' };
  if (d <= 100000) return { color: '#f1c40f', label: '1:100K' };
  if (d <= 200000) return { color: '#2ecc71', label: '1:200K' };
  if (d <= 500000) return { color: '#3498db', label: '1:500K' };
  if (d <= 1000000) return { color: '#9b59b6', label: '1:1M' };
  return { color: '#95a5a6', label: 'small' };
}

// Check if a file exists locally by making a HEAD request
async function checkLocalFile(mapId, idx) {
  try {
    const r = await fetch('/api/geokniga-file/' + mapId + '/' + idx + '?check=1');
    if (r.status === 200) return 'local';
    return 'missing';
  } catch(e) { return 'missing'; }
}

const FILE_TYPE_ICONS = { 'jpg': '🖼', 'jpeg': '🖼', 'png': '🖼', 'gif': '🖼', 'pdf': '📄', 'tif': '🖼', 'tiff': '🖼' };

function geoknigaPopup(f) {
  const p = f.properties || {};
  const parts = [`<b>${p.title || '?'}</b>`];
  if (p.nomer) parts.push(`<span style="color:#666">Номенклатура:</span> ${p.nomer}`);
  if (p.scale) parts.push(`<span style="color:#666">Масштаб:</span> ${p.scale}`);
  if (p.year) parts.push(`<span style="color:#666">Год:</span> ${p.year}`);
  if (p.series) parts.push(`<span style="color:#666">Серия:</span> ${p.series}`);
  if (p.labels && p.labels.length) parts.push(`<span style="color:#666">Метки:</span> ${p.labels.join(', ')}`);

  const files = p.files || [];
  if (files.length > 0) {
    parts.push('<hr style="margin:6px 0"><div style="font-weight:600;margin-bottom:3px;font-size:12px">Файлы (' + p.files_count + '):</div>');
    const total = p.files_total_size;
    if (total) parts.push('<div style="font-size:11px;color:#888">Всего: ' + total + '</div>');
    parts.push('<div style="max-height:200px;overflow-y:auto;font-size:12px">');
    files.forEach((f, i) => {
      const isImage = /^(jpg|jpeg|png|gif|tif|tiff)$/i.test(f.ext || '');
      const ext = f.ext ? f.ext.toUpperCase() : 'FILE';
      const icon = FILE_TYPE_ICONS[f.ext] || '📎';
      const localPath = '/api/geokniga-file/' + p.id + '/' + i;
      const remoteUrl = f.url;
      // Always show file, use local if available, external otherwise
      if (isImage) {
        // Try local first, fall back to remote
        parts.push('<div style="padding:2px 0">' + icon + ' <a href="#" onclick="tryOpenFile(' + p.id + ',' + i + ',\'' + remoteUrl.replace(/'/g, "\\'") + '\');return false">' + f.name + '</a> <span style="color:#888;font-size:11px">(' + f.size_str + ')</span></div>');
      } else {
        // Non-image: link to local path, fallback to remote
        parts.push('<div style="padding:2px 0">' + icon + ' <a href="' + localPath + '" target="_blank" onclick="if(this.href.indexOf(\'/api/geokniga-file/\')>=0){return tryOpenLocal(event,this,\'' + remoteUrl.replace(/'/g, "\\'") + '\')}">' + f.name + '</a> <span style="color:#888;font-size:11px">(' + f.size_str + ')</span></div>');
      }
    });
    parts.push('</div>');
  }

  parts.push('<hr style="margin:4px 0"><a href="' + p.url + '" target="_blank" style="font-size:11px;color:#888">Открыть на GeoKniga →</a>');
  return parts.join('<br>');
}

// Try to open locally, fall back to remote URL
function tryOpenLocal(event, el, remoteUrl) {
  fetch(el.href + '?check=1').then(r => {
    if (r.status !== 200) {
      event.preventDefault();
      window.open(remoteUrl, '_blank');
    }
  }).catch(() => {
    event.preventDefault();
    window.open(remoteUrl, '_blank');
  });
}

async function tryOpenFile(mapId, idx, remoteUrl) {
  const r = await fetch('/api/geokniga-file/' + mapId + '/' + idx + '?check=1');
  if (r.status === 200) {
    showGeoknigaFile(mapId, idx);
  } else {
    window.open(remoteUrl, '_blank');
  }
}

const geoknigaLayer = L.geoJSON(null, {
  style: (f) => {
    const { color } = geoknigaScaleLabel(f.properties?.scale);
    return { fillColor: color, color: '#666', weight: 0.3, fillOpacity: 0.12 };
  },
  pointToLayer: (f, latlng) => {
    const { color } = geoknigaScaleLabel(f.properties?.scale);
    return L.circleMarker(latlng, {
      radius: 3, fillColor: color, color: '#333', weight: 0.5, fillOpacity: 0.4,
    });
  },
  onEachFeature: (f, layer) => {
    layer.bindPopup(geoknigaPopup(f));
  },
});

// ── Image/PDF viewer for GeoKniga files ──
let currentViewerMapId = 0;
let currentViewerIdx = 0;
let currentViewerFiles = [];

function showGeoknigaFile(mapId, idx) {
  const overlay = document.getElementById('viewer-overlay');
  const img = document.getElementById('viewer-img');
  const pdf = document.getElementById('viewer-pdf');
  const err = document.getElementById('viewer-error');
  const title = document.getElementById('viewer-title');
  const counter = document.getElementById('viewer-counter');

  img.style.display = 'none';
  pdf.style.display = 'none';
  err.style.display = 'none';

  currentViewerMapId = mapId;
  currentViewerIdx = idx;

  // Find the map's files from loaded GeoJSON
  if (!window._geoknigaFC) {
    err.style.display = 'block';
    err.textContent = 'Catalog not loaded';
    overlay.style.display = 'flex';
    return;
  }
  let feat = null;
  for (const f of window._geoknigaFC.features) {
    if (f.properties.id === mapId) { feat = f; break; }
  }
  if (!feat) {
    err.style.display = 'block'; err.textContent = 'Map not found';
    overlay.style.display = 'flex'; return;
  }
  currentViewerFiles = feat.properties.files || [];
  displayViewerFile();
  overlay.style.display = 'flex';
}

function displayViewerFile() {
  const img = document.getElementById('viewer-img');
  const pdf = document.getElementById('viewer-pdf');
  const err = document.getElementById('viewer-error');
  const title = document.getElementById('viewer-title');
  const counter = document.getElementById('viewer-counter');
  const prevBtn = document.getElementById('viewer-prev');
  const nextBtn = document.getElementById('viewer-next');

  img.style.display = 'none';
  pdf.style.display = 'none';
  err.style.display = 'none';

  const finfo = currentViewerFiles[currentViewerIdx];
  if (!finfo) {
    err.style.display = 'block'; err.textContent = 'File not found';
    overlay.style.display = 'flex'; return;
  }

  title.textContent = finfo.name + ' (' + finfo.size_str + ')';
  counter.textContent = (currentViewerIdx + 1) + '/' + currentViewerFiles.length;
  prevBtn.disabled = currentViewerIdx === 0;
  nextBtn.disabled = currentViewerIdx >= currentViewerFiles.length - 1;

  const localPath = '/api/geokniga-file/' + currentViewerMapId + '/' + currentViewerIdx;
  const ext = (finfo.ext || '').toLowerCase();

  if (/^(jpg|jpeg|png|gif|tif|tiff)$/.test(ext)) {
    img.src = localPath;
    img.style.display = 'block';
    img.onerror = function() {
      img.style.display = 'none';
      err.style.display = 'block';
      err.textContent = 'Failed to load image (not yet downloaded)';
    };
  } else if (ext === 'pdf') {
    pdf.data = localPath;
    pdf.style.display = 'block';
    pdf.onerror = function() {
      pdf.style.display = 'none';
      err.style.display = 'block';
      err.textContent = 'Failed to load PDF (not yet downloaded)';
    };
  } else {
    err.style.display = 'block';
    err.textContent = 'Preview not available for this file type. Download: ' + localPath;
  }
}

function nextGeoknigaFile() {
  if (currentViewerIdx < currentViewerFiles.length - 1) {
    currentViewerIdx++;
    displayViewerFile();
  }
}

function prevGeoknigaFile() {
  if (currentViewerIdx > 0) {
    currentViewerIdx--;
    displayViewerFile();
  }
}

function closeGeoknigaViewer() {
  document.getElementById('viewer-overlay').style.display = 'none';
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeGeoknigaViewer();
  if (e.key === 'ArrowRight') nextGeoknigaFile();
  if (e.key === 'ArrowLeft') prevGeoknigaFile();
});

// ── layer visibility helper ──
L.Layer.include({
  setVisible(on) {
    if (on) { if (!map.hasLayer(this)) this.addTo(map); }
    else { if (map.hasLayer(this)) this.remove(); }
  }
});

const GEOL_COLORS = {
  'CEN': { fill: '#f0e68c', stroke: '#b8a84c', label: 'Cenozoic' },
  'MES': { fill: '#8fbc8f', stroke: '#5a8a5a', label: 'Mesozoic' },
  'PAL': { fill: '#87ceeb', stroke: '#4a8ebd', label: 'Paleozoic' },
  'PCU': { fill: '#dda0dd', stroke: '#9b59b6', label: 'Precambrian' },
  'PRO': { fill: '#ba90c6', stroke: '#7b4f96', label: 'Proterozoic' },
  'ARC': { fill: '#cd5c5c', stroke: '#8b3a3a', label: 'Archean' },
  'REC': { fill: '#f5f5dc', stroke: '#b8b886', label: 'Recent' },
};
const GEOL_DEFAULT = { fill: '#ccc', stroke: '#999', label: 'Unknown' };

// Geology
const geolLayer = L.geoJSON(null, {
  style: (f) => {
    const a = f.properties?.AGERA || '';
    const c = GEOL_COLORS[a] || GEOL_DEFAULT;
    return { color: c.stroke, fillColor: c.fill, weight: 1, fillOpacity: 0.35 };
  },
  onEachFeature: (f, layer) => {
    const p = f.properties || {};
    const era = (GEOL_COLORS[p.AGERA] || GEOL_DEFAULT).label;
    const rock = p.RXTP || '';
    layer.bindPopup(`<b>${era}</b><br>${rock}${p.NAME ? '<br>' + p.NAME : ''}`);
  },
});
fetch('/api/geology-layer').then(r => r.json()).then(fc => {
  geolLayer.addData(fc);
  document.getElementById('chk-geol').disabled = false;
}).catch(() => {});

// Groundwater
const gwLayer = L.geoJSON(null, {
  style: (f) => {
    const t = f.properties?.aquifertyp || f.properties?.category || '';
    const c = t.includes('confined') ? '#4488cc' : t.includes('unconfined') ? '#66aadd' : '#8899bb';
    return { color: c, fillColor: c, weight: 1, fillOpacity: 0.15 };
  },
  onEachFeature: (f, layer) => {
    const p = f.properties || {};
    const info = Object.entries(p).slice(0, 5).map(([k, v]) => v ? `${k}: ${v}` : '').filter(Boolean).join('<br>');
    layer.bindPopup(info || 'Groundwater aquifer');
  },
});
fetch('/api/gw-aquifertype').then(r => r.json()).then(fc => {
  gwLayer.addData(fc);
  document.getElementById('chk-gw').disabled = false;
}).catch(() => {});

fetch('/api/health').then(r => r.json()).then(h => {
  document.title = `Earthdata — ${h.gebco_cog || h.aster_vrt ? 'ONLINE' : 'OFFLINE'}`;
});

fetch('/api/mrds-layer').then(r => r.json()).then(fc => {
  mrdsLayer.addData(fc);
}).catch(() => {});

function toggleMiningLegend(show) {
  document.getElementById('mining-legend').style.display = show ? 'block' : 'none';
}

function buildMiningLegend(fc) {
  const seen = new Set();
  const legend = document.getElementById('mining-legend');
  fc.features.forEach(f => {
    const r = (f.properties?.resource || '').toLowerCase();
    if (!r || seen.has(r)) return;
    seen.add(r);
    const c = resourceColor(r);
    legend.innerHTML += `<div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c};margin-right:4px"></span>${r}</div>`;
  });
}

fetch('/api/osm-mining').then(r => r.json()).then(fc => {
  osmMiningLayer.addData(fc);
  buildMiningLegend(fc);
  document.getElementById('chk-osm-mining').checked = true;
}).catch(() => {});

function toggleRosnedraLegend(show) {
  document.getElementById('rosnedra-legend').style.display = show ? 'block' : 'none';
}

function buildRosnedraLegend(fc) {
  const seen = new Set();
  const legend = document.getElementById('rosnedra-legend');
  fc.features.forEach(f => {
    const r = f.properties?.mineral_cat;
    if (!r || seen.has(r)) return;
    seen.add(r);
    const c = ROSNEDRA_COLORS[r] || '#95a5a6';
    const label = { 'углеводородное сырье': 'Hydrocarbons', 'промышленные подземные воды': 'Industrial water', 'минеральные воды': 'Mineral water', 'другое': 'Other' }[r] || r;
    legend.innerHTML += `<div><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c};margin-right:4px"></span>${label}</div>`;
  });
}

fetch('/api/rosnedra').then(r => r.json()).then(fc => {
  rosnedraLayer.addData(fc);
  buildRosnedraLegend(fc);
  document.getElementById('chk-rosnedra').checked = true;
}).catch(() => {});

function toggleGeoknigaLegend(show) {
  document.getElementById('geokniga-legend').style.display = show ? 'block' : 'none';
}

function buildGeoknigaLegend(fc) {
  const seen = new Set();
  const legend = document.getElementById('geokniga-legend');
  fc.features.forEach(f => {
    const s = f.properties?.scale;
    if (!s) return;
    const { color, label } = geoknigaScaleLabel(s);
    if (seen.has(label)) return;
    seen.add(label);
    legend.innerHTML += `<div><span style="display:inline-block;width:10px;height:10px;background:${color};margin-right:4px;border:1px solid #666"></span>${label}</div>`;
  });
}

fetch('/api/geokniga-catalog').then(r => r.json()).then(fc => {
  window._geoknigaFC = fc;
  geoknigaLayer.addData(fc);
  buildGeoknigaLegend(fc);
  document.getElementById('chk-geokniga').checked = true;
}).catch(() => {});

// Click query
map.on('click', async (e) => {
  const { lat, lng } = e.latlng;
  document.getElementById('coord-val').textContent = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  document.getElementById('info-panel').style.display = 'block';

  try {
    const res = await fetch(`/api/query?lat=${lat}&lon=${lng}`);
    const data = await res.json();
    document.getElementById('elev-val').textContent = data.elevation_m != null ? `${data.elevation_m.toFixed(1)} m` : '—';
    document.getElementById('geol-val').textContent = data.geology?.rock_type || '—';
    document.getElementById('rock-val').textContent = data.geology?.age_era || '—';
    const gw = data.gw_tba || data.gw_aquifertype || {};
    document.getElementById('gw-val').textContent = gw.aquifer || gw.aquifertyp || gw.category || '—';

    const dl = document.getElementById('deposits-list');
    dl.innerHTML = '';
    (data.mineral_deposits || []).slice(0, 10).forEach(d => {
      dl.innerHTML += `<div class="deposit"><b>${d.name || '?'}</b> — ${d.c1 || d.ct || ''} <span style="color:#999;font-size:11px">${d.dist_deg ? d.dist_deg.toFixed(2) + '°' : ''}</span></div>`;
    });
    if ((data.mineral_deposits || []).length === 0) dl.innerHTML = '<div style="color:#999">None nearby</div>';
  } catch(e) {
    document.getElementById('elev-val').textContent = 'error';
  }
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('#info-panel') && !e.target.closest('#map') && !e.target.closest('.controls') && !e.target.closest('#search-results')) {
    document.getElementById('info-panel').style.display = 'none';
    document.getElementById('search-results').style.display = 'none';
  }
});

async function searchMineral() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  const res = await fetch(`/api/search?commodity=${encodeURIComponent(q)}&limit=50`);
  const data = await res.json();
  const div = document.getElementById('search-results');
  div.innerHTML = '';
  div.style.display = 'block';
  if (data.count === 0) {
    div.innerHTML = '<div style="padding:12px;color:#999">Nothing found</div>';
    return;
  }
  data.results.forEach(r => {
    div.innerHTML += `<div class="item" onclick="map.setView([${r.lat},${r.lon}], 10);document.getElementById('search-results').style.display='none'"><b>${r.name || '?'}</b> — ${r.commodity} <span style="color:#999">${r.country || ''}</span></div>`;
  });
}
</script>
